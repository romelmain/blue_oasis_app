<div><span>BLUE OASIS HOTEL</span></div>
<span>{{ headerMenu.userName }}: {{ headerMenu.role }}</span>
<nav>
  <ul class="menu-horizontal">
    @for (item of menu; track $index) {
    <li>
      <a routerLink="/{{ item.path }}">{{ item.name }}</a>
    </li>
    }
    <li>
      <img
        (click)="logout()"
        width="30px"
        height="25px"
        src="/images/logout.png"
      />
    </li>
  </ul>
</nav>
