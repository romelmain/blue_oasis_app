<div class="mb-4 p-8 flex items-center justify-center">
  <p-card [style]="{ width: '25rem', overflow: 'hidden' }">
    <ng-template #header>
      <img
        alt="Card"
        class="w-full"
        src="{{ getMainImage(room()?.imageRoom) }}"
      />
    </ng-template>
    <ng-template #title>Room Number: {{ room()?.number }}° </ng-template>
    <ng-template #subtitle>
      availability: {{ room()?.availability }}
    </ng-template>
    <p>Price: ${{ room()?.price }}</p>
    <p>{{ getMainImage(room()?.imageRoom) }}</p>
    <ng-template #footer>
      <div class="flex gap-4 mt-1">
        <p-button
          label="Cancel"
          severity="secondary"
          class="w-full"
          [outlined]="true"
          styleClass="w-full"
        />
        <p-button label="Save" class="w-full" styleClass="w-full" />
      </div>
    </ng-template>
  </p-card>
</div>
