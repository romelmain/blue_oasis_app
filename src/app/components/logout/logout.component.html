<div class="card flex justify-center">
  <img
    (click)="showDialog()"
    width="30px"
    height="25px"
    src="/images/logout.png"
  />
  <p-dialog
    header="LOGOUT"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '25rem' }"
  >
    <span class="p-text-secondary block mb-8"
      >Are you sure to out from Blue Oasis app?</span
    >

    <div class="flex justify-end gap-2">
      <p-button label="Cancel" severity="secondary" (click)="visible = false" />
      <p-button label="Ok" (click)="deleteToken()" />
    </div>
  </p-dialog>
</div>
