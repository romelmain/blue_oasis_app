<div class="body"></div>
<div class="grad"></div>
<div class="header">
  <div><span>Blue Oasis</span><br /><span>Hotel</span></div>
</div>
<br />
<div class="login">
  <form [formGroup]="loginForm">
    <input
      type="text"
      placeholder="username"
      formControlName="username"
    /><br />
    <input
      type="password"
      placeholder="password"
      formControlName="password"
    /><br />
    <button (click)="postLogin()">Login</button>
  </form>
</div>
